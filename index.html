<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decimal Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--panel:#fff;--ink:#1f2d3d;--mute:#6b7a8c;--tab:#dbe3ef;--accent:#2f6fed;--good:#1f9d55;--bad:#d64545;--line:#c5cfdd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a26;--panel:#1c2738;--ink:#eaf0f8;--mute:#9aa9bc;--tab:#26344a;--accent:#5b92ff;--good:#41c17d;--bad:#ff7070;--line:#3a4a63}}
:root[data-theme="dark"]{--bg:#121a26;--panel:#1c2738;--ink:#eaf0f8;--mute:#9aa9bc;--tab:#26344a;--accent:#5b92ff;--good:#41c17d;--bad:#ff7070;--line:#3a4a63}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:2rem;margin:0 0 4px}
.score{color:var(--mute);font-weight:600;font-size:1.2rem;margin-bottom:20px}
.tabs{display:flex;gap:4px;background:var(--tab);padding:5px;border-radius:10px;margin-bottom:24px}
.tabs button{border:0;background:none;color:var(--ink);font:700 1.2rem 'Fredoka',system-ui,sans-serif;padding:8px 20px;border-radius:7px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
.card{background:var(--panel);width:100%;max-width:360px;padding:26px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.12);text-align:center}
.q{font-size:2rem;font-weight:700;margin:0 0 18px}
input{width:100%;font:1.2rem 'Fredoka',system-ui,sans-serif;text-align:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:16px}
.go{width:100%;border:0;border-radius:8px;padding:12px;background:var(--good);color:#fff;font:700 1.15rem 'Fredoka',system-ui,sans-serif;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{min-height:1.6em;margin-top:22px;font-weight:600;font-size:1.1rem;text-align:center}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
</style>
</head>
<body>
<h1>🧮 Decimal Dash</h1>
<div class="score">Score: <span id="score">0</span></div>
<div class="tabs" id="tabs"></div>
<div class="card">
  <p class="q" id="q"></p>
  <input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="Type your answer" aria-label="Your answer">
  <button class="go" id="go">Check answer</button>
</div>
<div class="fb" id="fb" role="status" aria-live="polite"></div>

<script>
const OPS = ['+','-','*','/'];
const SYM = {'+':'+','-':'−','*':'×','/':'÷'};
let op='+', n1=0, n2=0, answer=0, score=0, misses=0, timer=null;
const $ = id => document.getElementById(id);
const rnd = (min,max) => Math.round((Math.random()*(max-min)+min)*10)/10; // one decimal place
const r2 = x => Math.round(x*100)/100;

function newQuestion(){
  clearTimeout(timer);
  misses=0;
  if(op==='/'){ n2=rnd(0.5,9.9); answer=rnd(0.5,12); n1=r2(n2*answer); }
  else { n1=rnd(0.1,20); n2=rnd(0.1,20);
    if(op==='-' && n2>n1) [n1,n2]=[n2,n1];
    if(op==='*'){ n1=rnd(0.1,12); n2=rnd(0.1,12); }
    answer = op==='+' ? r2(n1+n2) : op==='-' ? r2(n1-n2) : r2(n1*n2);
  }
  $('q').textContent = `${n1} ${SYM[op]} ${n2} = ?`;
  $('ans').value=''; setFb('');
  $('ans').focus();
}
function setFb(msg,cls){ const f=$('fb'); f.textContent=msg; f.className='fb '+(cls||''); }

function check(){
  const raw=$('ans').value.trim().replace(',','.');
  if(raw===''||isNaN(Number(raw))){ setFb('Enter a number to check.','bad'); return; }
  if(Math.abs(Number(raw)-answer)<0.005){
    score++; $('score').textContent=score;
    setFb('✅ Correct!','good');
    clearTimeout(timer); timer=setTimeout(newQuestion,1500);
  } else {
    misses++;
    setFb(misses>=3 ? `❌ Not quite. The answer is ${answer}.` : '❌ Not quite. Check your decimal places and try again.','bad');
  }
}
function setOp(o){
  op=o;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.op===o));
  newQuestion();
}

OPS.forEach(o=>{
  const b=document.createElement('button');
  b.textContent=SYM[o]; b.dataset.op=o; b.setAttribute('aria-label','Operation '+SYM[o]);
  b.onclick=()=>setOp(o); $('tabs').appendChild(b);
});
$('go').onclick=check;
$('ans').addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
setOp('+');
</script>
</body>
</html>
